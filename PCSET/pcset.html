<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PC Set - Piano</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f1eb;
            color: #252525;
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
        }

        main {
            width: min(46vw, 380px);
            text-align: center;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(1.5rem, 4vw, 2.25rem);
        }

        #piano {
            width: 100%;
            height: auto;
            user-select: none;
        }

        .white-key,
        .black-key {
            cursor: pointer;
            transition: fill 80ms ease;
        }

        .white-key {
            fill: #fff;
            stroke: #000000;
            stroke-width: 2;
        }

        .white-key:hover {
            fill: #e7edf8;
        }

        .white-key.selected {
            fill: #ff0000;
        }

        .black-key {
            fill: #202020;
            stroke: #111;
            stroke-width: 2;
        }

        .black-key:hover {
            fill: #3b3b3b;
        }

        .black-key.selected {
            fill: #ff0000;
        }

        .key-label {
            pointer-events: none;
            font-size: 16px;
            fill: #555;
        }

        #key-info {
            width: 100%;
            margin: 1rem 0 0;
            border-collapse: collapse;
            border: none;
            table-layout: fixed;
        }

        #key-info th,
        #key-info td {
            border: none;
            padding: 0.25rem 0.5rem;
        }

        #key-info th {
            width: 110px;
            position: sticky;
            left: 0;
            text-align: left;
            font-weight: normal;
        }

        #key-info td {
            text-align: left;
        }

        #reset {
            margin-top: 0.75rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid #777;
            border-radius: 4px;
            background: #fff;
            color: #252525;
            cursor: pointer;
            font: inherit;
        }

        #calculate {
            margin-top: 0.75rem;
            margin-left: 0.5rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid #777;
            border-radius: 4px;
            background: #fff;
            color: #252525;
            cursor: pointer;
            font: inherit;
        }

        #reset:hover,
        #calculate:hover {
            background: #e7edf8;
        }
    </style>
</head>

        const status = document.querySelector("#status");
        const storedKeys = new Set();
        let storedKeyCount = 0;

        function updateStoredKeys() {
            storedKeyCount = storedKeys.size;

            if (storedKeyCount === 0) {
                status.textContent = "none";
                return;
            }

            status.textContent = `${Array.from(storedKeys).join(", ")}`;
        }

        function updatePCS() {
            const pcs = Array.from(storedKeys).map(note => notepcmap[note]);
            document.querySelector("#pcs").textContent = pcs.length > 0 ? pcs.join(", ") : "none";
        }

        function toggleKey(key) {
            if (!key) return;

            const note = key.dataset.note;
            if (storedKeys.has(note)) {
                storedKeys.delete(note);
                key.classList.remove("selected");
                key.setAttribute("aria-pressed", "false");
            } else {
                storedKeys.add(note);
                key.classList.add("selected");
                key.setAttribute("aria-pressed", "true");
            }

            updateStoredKeys();
            updatePCS();
        }

        function calculateNormalForm(pcs) {
            const ascendingpc = [...pcs].sort((a, b) => a - b); // copy so the input isn't mutated
            if (ascendingpc.length < 2) return null;

            // start with the wrap-around gap (last note up to the first note, an octave higher)
            let maxint = ascendingpc[0] + 12 - ascendingpc[ascendingpc.length - 1];
            let startingpc = ascendingpc[0];

            for (let i = 1; i < ascendingpc.length; i++) {
                const diff = ascendingpc[i] - ascendingpc[i - 1];
                if (diff > maxint) {
                    maxint = diff;
                    startingpc = ascendingpc[i];
                }
            }

            const index = ascendingpc.indexOf(startingpc);
            const rotated = ascendingpc.slice(index).concat(ascendingpc.slice(0, index));
            return rotated.join(", ");
        }

        function calculatePrimeForm(pcs) {
            // Placeholder for prime form calculation
            const primeform = pcs.map(pc => (pc + 12 - pcs[0]) % 12).sort((a, b) => a - b);
            return primeform.join(", ");
        }

        function calculatePrimeFormCheckInvert(pcs) {
            // Placeholder for prime form calculation
            const primeform = pcs.map(pc => (pc + 12 - pcs[0]) % 12).sort((a, b) => a - b);
            // Check inversion
            const maxpc = Math.max(...primeform);
            const inverted = primeform.map(pc => (maxpc - pc)).sort((a, b) => a - b);
            // Compare primeform against inverted
            if (inverted[1]-inverted[0] < primeform[1]-primeform[0]) {
                return inverted.join(", ");
            } else {
                return primeform.join(", ");
            }
        }

        function findForteName(pcs) {
            if (!pcs || pcs.length === 0) return "none";

            const original = [...new Set(pcs)].map(Number).sort((a, b) => a - b);
            const variants = [];

            for (let transposition = 0; transposition < 12; transposition++) {
                const transposed = original.map(pc => (pc + transposition) % 12).sort((a, b) => a - b);
                variants.push(transposed.map(pc => (pc - transposed[0] + 12) % 12).sort((a, b) => a - b));

                const inverted = original.map(pc => (-pc + transposition + 12) % 12).sort((a, b) => a - b);
                variants.push(inverted.map(pc => (pc - inverted[0] + 12) % 12).sort((a, b) => a - b));
            }

            for (const variant of variants) {
                const name = ForteNameMap[variant.join(",")];
                if (name) return name;
            }

            return "none";
        }

                document.querySelector("#prime-form-tni").textContent = "none";
                document.querySelector("#forte-name").textContent = "none";

            const normalForm = calculateNormalForm(pcs);
