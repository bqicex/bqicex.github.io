<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>Score</title>
    <style>
        :root {
            --accent: royalblue;
            --hover: crimson;
            --border: black;
            --muted: green;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 16px 16px 24px;
            background: white;
            color: #222;
        }

        /* ---------- toolbar ---------- */
        #nav {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        #nav button {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: #fff;
            font: inherit;
            cursor: pointer;
        }

        #nav button:hover:not(:disabled) {
            background: #eef2ff;
            border-color: var(--accent);
        }

        #nav button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #pageLabel {
            min-width: 110px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9em;
        }

        /* ---------- score ---------- */
        #notation1 {
            background: #fff;
            border: 1px solid var(--border);
            padding: 8px;
            overflow-x: auto;
        }

        #notation1 g.note,
        #notation1 g.reh {
            cursor: pointer;
        }

        #notation1 .sel,
        #notation1 .sel * {
            fill: var(--accent);
            stroke: var(--accent);
        }

        #notation1 .hl,
        #notation1 .hl * {
            fill: var(--hover);
            stroke: var(--hover);
        }

        #notation1 .note-focus .notehead,
        #notation1 .note-focus .notehead * {
            fill: var(--hover) !important;
            stroke: var(--hover) !important;
        }

        /* ---------- anchored info panel ---------- */
        #info {
            position: fixed;
            width: min(360px, calc(100% - 24px));
            max-height: 45vh;
            overflow-y: auto;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid var(--border);
            z-index: 10;
        }

        #info:not([hidden]) {
            cursor: move;
        }

        #info[hidden] {
            display: none;
        }

        #info .head {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        #info h2 {
            margin: 0;
            font-size: 1em;
        }

        #info .count {
            color: var(--muted);
            font-size: 0.8em;
        }

        #info .close {
            margin-left: auto;
            border: none;
            background: none;
            font-size: 1.3em;
            line-height: 1;
            color: var(--muted);
            cursor: pointer;
        }

        #info .close:hover {
            color: #000;
        }

        #info p {
            margin: 4px 0 0;
            font-size: 0.9em;
        }

        #info details {
            margin-top: 6px;
            font-size: 0.8em;
            color: var(--muted);
        }

        #info summary {
            cursor: pointer;
        }

        #info code {
            display: inline-block;
            margin: 2px 6px 2px 0;
        }

        #info .harmonic-render {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #ccc;
        }

        #info .harmonic-render h3 {
            margin: 0 0 4px;
            font-size: 0.9em;
        }

        #info .harmonic-render-score svg {
            display: block;
            width: 100%;
            height: auto;
        }

        #info .image-render {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #ccc;
        }

        #info .image-render img {
            display: block;
            width: 100%;
            height: auto;
        }

        #videoInfo {
            position: fixed;
            right: 12px;
            bottom: 12px;
            width: min(360px, calc(100% - 24px));
            padding: 10px 14px;
            background: #fff;
            border: 1px solid var(--border);
            z-index: 9;
        }

        #videoInfo h2 {
            margin: 0 0 8px;
            font-size: 1em;
        }

        #videoInfo .video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
        }

        #videoInfo a {
            display: block;
            margin-top: 8px;
            font-size: 0.85em;
        }
    </style>

        function setClass(container, ids, cls, on) {
            ids.forEach(id => {
                const el = findEl(container, id);
                if (el) el.classList.toggle(cls, on);
            });
        }

        function highlightNotes(container, ...ids) {
            const noteIds = ids.flatMap(id => Array.isArray(id) ? id : [id]);
            clearNoteHighlights(container);
            highlightedNoteIds = [...noteIds];
            setClass(container, highlightedNoteIds, "note-focus", true);
        }

        function clearNoteHighlights(container) {
            highlightedNoteIds = [];
            container.querySelectorAll(".note-focus").forEach(el => el.classList.remove("note-focus"));
        }

        function applySelection(container) {
            container.querySelectorAll(".sel").forEach(el => el.classList.remove("sel"));
            if (selectedGroup) {
                setClass(container, groups[selectedGroup], "sel", true);
            } else if (selectedElementId) {
                setClass(container, [selectedElementId], "sel", true);
            }
        }

        function clearSelection(container) {
            selectedGroup = null;
            selectedElementId = null;
            cancelDynamicGliss?.();
            clearNoteHighlights(container);
            applySelection(container);
            updateAside(null);
        }

        function positionAside(aside, anchor) {
            const gap = 12;
            const margin = 12;
            const anchorRect = anchor.getBoundingClientRect();
            const asideWidth = aside.offsetWidth;
            const asideHeight = aside.offsetHeight;
            const left = anchorRect.right + gap + asideWidth <= window.innerWidth - margin
                ? anchorRect.right + gap
                : anchorRect.left - asideWidth - gap;
            const top = anchorRect.top - asideHeight - gap;

            aside.style.left = `${Math.max(margin, Math.min(left, window.innerWidth - asideWidth - margin))}px`;
            aside.style.top = `${Math.max(margin, Math.min(top, window.innerHeight - asideHeight - margin))}px`;
        }

        function updateAside(groupName, anchor) {
            const aside = document.getElementById("info");
            aside.replaceChildren();

            if (!groupName) {
                aside.hidden = true;
                return;
            }

            const info = groupInfo[groupName] || {};
            const ids = groups[groupName];

            const make = (tag, text, cls) => {
                const el = document.createElement(tag);
                if (text !== undefined) el.textContent = text;
                if (cls) el.className = cls;
                return el;
            };
            const makeMarkup = (tag, markup, cls) => {
                const el = make(tag, undefined, cls);
                el.innerHTML = markup;
                return el;
            };

            const close = make("button", "\u00d7", "close");
            close.type = "button";
            close.title = "Close (Esc)";
            close.id = "infoClose";
            aside.append(close);

            if (info.description) aside.append(makeMarkup("div", info.description));

            const details = make("details");

            aside.hidden = false;
            positionAside(aside, anchor);
        }

            bassoonbass: onBassoonbassClick,
            bassoonbass2: onBassoonbass2Click,
            bassoonbass3: onBassoonbass3Click,
            bassoonbass4: onBassoonbass4Click,
            bassoonbass5: onBassoonbass5Click,
            bassoonbass6: onBassoonbass6Click,
            bassoonbass7: onBassoonbass7Click,
            bassoonbass8: onBassoonbass8Click,
            bassoonmel2: onbassoonmel2Click,
            bassoonmel3: onBassoonmel3Click,
            reh1: onReh1Click,
            reh2: onReh2Click,
            reh3: onReh3Click,
            reh4: onReh4Click,
            reh5: onReh5Click,
            reh6: onReh6Click,
            reh7: onReh7Click,
        };

        function onNoteClick(noteId, groupName, event, container, actions) {
            groupClickHandlers[groupName]?.(noteId, event, container, actions);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const aside = document.getElementById("info");
            let dragState = null;

            aside.addEventListener("pointerdown", (e) => {
                if (e.button !== 0 || e.target.closest("button, summary, a, input, select, textarea, iframe")) {
                    return;
                }

                const rect = aside.getBoundingClientRect();
                dragState = {
                    offsetX: e.clientX - rect.left,
                    offsetY: e.clientY - rect.top,
                    pointerId: e.pointerId,
                };
                aside.setPointerCapture(e.pointerId);
                aside.style.userSelect = "none";
            });

            aside.addEventListener("pointermove", (e) => {
                if (!dragState || e.pointerId !== dragState.pointerId) return;

                const margin = 12;
                const maxLeft = Math.max(margin, window.innerWidth - aside.offsetWidth - margin);
                const maxTop = Math.max(margin, window.innerHeight - aside.offsetHeight - margin);
                const left = Math.min(Math.max(margin, e.clientX - dragState.offsetX), maxLeft);
                const top = Math.min(Math.max(margin, e.clientY - dragState.offsetY), maxTop);
                aside.style.left = `${left}px`;
                aside.style.top = `${top}px`;
            });

            const stopDragging = (e) => {
                if (!dragState || e.pointerId !== dragState.pointerId) return;
                if (aside.hasPointerCapture(e.pointerId)) aside.releasePointerCapture(e.pointerId);
                aside.style.userSelect = "";
                dragState = null;
            };

            aside.addEventListener("pointerup", stopDragging);
            aside.addEventListener("pointercancel", stopDragging);

            await new Promise(res => {
                if (verovio.module.calledRun) res();
                else verovio.module.onRuntimeInitialized = res;
            });

            const options = { //Verovio Options
                adjustPageWidth: false,
                pageHeight: 2000,
                pageMarginTop: 50,
                pageWidth: 1500,
                scale: 40,
                pageMarginRight: 0,
                adjustPageHeight: false,
                breaks: "auto",
                minLastJustification: 0.8,
                spacingSystem: 20,
                footer: "none",
                systemDivider: "none"
            };

            async function setupExample(file, notationId) {
                const tk = new verovio.toolkit();
                tk.setOptions(options);

                let mei = await (await fetch(file)).text();
                if (!tk.loadData(mei)) {
                    console.error(tk.getLog());
                    return;
                }

                const container = document.getElementById(notationId);
                const prevBtn = document.getElementById("prev");
                const nextBtn = document.getElementById("next");
                const pageLabel = document.getElementById("pageLabel");
                let pageCount = tk.getPageCount();
                let currentPage = 1;
                let nextGlissNumber = 1;
                const dynamicGlissIds = new Set();
                let nextHarmNumber = 1;
                const dynamicHarmIds = new Set();
                let refreshScheduled = false;

                function scheduleRefresh() {
                    if (refreshScheduled) return;
                    refreshScheduled = true;
                    queueMicrotask(() => {
                        refreshScheduled = false;
                        if (!tk.loadData(mei)) {
                            console.error(tk.getLog());
                            return;
                        }
                        pageCount = tk.getPageCount();
                        renderPage(currentPage);
                    });
                }

                function addGliss(startId, endId) {
                    const startRef = startId.replace(/^#/, "");
                    const endRef = endId.replace(/^#/, "");
                    const parser = new DOMParser();
                    const document = parser.parseFromString(mei, "application/xml");
                    const findByXmlId = id => [...document.getElementsByTagName("*")]
                        .find(el => el.getAttribute("xml:id") === id);
                    const start = findByXmlId(startRef);
                    const end = findByXmlId(endRef);
                    if (!start || !end) {
                        console.error(`Cannot add gliss: source notes not found (${startId}, ${endId}).`);
                        return;
                    }
                    const measure = start.closest("measure");
                    if (!measure) {
                        console.error(`Cannot add gliss: start note is not inside a measure (${startId}).`);
                        return;
                    }
                    const existingGliss = [...document.getElementsByTagName("gliss")]
                        .find(gliss =>
                            gliss.getAttribute("startid") === `#${startRef}` &&
                            gliss.getAttribute("endid") === `#${endRef}`);
                    if (existingGliss) return;

                    const gliss = document.createElementNS(
                        "http://www.music-encoding.org/ns/mei",
                        "gliss"
                    );
                    let glissId;
                    do {
                        glissId = `gliss${nextGlissNumber++}`;
                    } while (findByXmlId(glissId));
                    gliss.setAttribute("xml:id", glissId);
                    gliss.setAttribute("startid", `#${startRef}`);
                    gliss.setAttribute("endid", `#${endRef}`);
                    gliss.setAttribute("color", "red");
                    measure.insertBefore(gliss, measure.querySelector("reh"));
                    dynamicGlissIds.add(glissId);

                    mei = new XMLSerializer().serializeToString(document);
                    scheduleRefresh();
                }

                function addHarm(text, targetId, placement = "below", verticalOffset) {
                    if (placement !== "above" && placement !== "below") {
                        console.error(`Cannot add harm: placement must be "above" or "below" (received "${placement}").`);
                        return;
                    }
                    const targetRef = targetId.replace(/^#/, "");
                    const parser = new DOMParser();
                    const document = parser.parseFromString(mei, "application/xml");
                    const findByXmlId = id => [...document.getElementsByTagName("*")]
                        .find(el => el.getAttribute("xml:id") === id);
                    const target = findByXmlId(targetRef);
                    if (!target) {
                        console.error(`Cannot add harm: target note not found (${targetId}).`);
                        return;
                    }
                    const measure = target.closest("measure");
                    if (!measure) {
                        console.error(`Cannot add harm: target note is not inside a measure (${targetId}).`);
                        return;
                    }
                    const existingHarm = [...document.getElementsByTagName("harm")]
                        .find(harm =>
                            harm.getAttribute("startid") === `#${targetRef}` &&
                            harm.textContent === text &&
                            harm.getAttribute("place") === placement);
                    if (existingHarm) return;

                    let harmId;
                    do {
                        harmId = `harm${nextHarmNumber++}`;
                    } while (findByXmlId(harmId));

                    const harm = document.createElementNS(
                        "http://www.music-encoding.org/ns/mei",
                        "harm"
                    );
                    harm.setAttribute("xml:id", harmId);
                    harm.setAttribute("startid", `#${targetRef}`);
                    harm.setAttribute("place", placement);
                    harm.setAttribute(
                        "vo",
                        verticalOffset ?? (placement === "above" ? "3" : "-4")
                    );
                    harm.setAttribute("ho", "-1");
                    harm.setAttribute("color", "red");
                    harm.textContent = text;
                    measure.insertBefore(harm, measure.querySelector("reh"));
                    dynamicHarmIds.add(harmId);

                    mei = new XMLSerializer().serializeToString(document);
                    scheduleRefresh();
                }


                function renderDyads() {
                    const aside = document.getElementById("info");
                    const renderContainer = document.createElement("div");
                    renderContainer.className = "harmonic-render";
                    renderContainer.innerHTML = `
                        <div class="harmonic-render-score"></div>
                    `;

                    const dyadMei = `
                        <mei xmlns="http://www.music-encoding.org/ns/mei" meiversion="5.1">
                            <music>
                                <body>
                                    <mdiv>
                                        <score>
                                            <scoreDef>
                                                <staffGrp>
                                                    <staffDef n="1" lines="5">
                                                        <clef shape="G" line="2"/>
                                                    </staffDef>
                                                </staffGrp>
                                            </scoreDef>
                                            <section>
                                                <measure n="1">
                                            <staff n="1">
                                                <layer n="1">
                                                    <note dur="4" pname="b" oct="4"/>
                                                    <note dur="4" pname="a" oct="4"/>
                                                    <note dur="4" pname="g" oct="4">
                                                        <accid accid="s"/>
                                                    </note>
                                                    <note dur="4" pname="g" oct="4">
                                                        <accid accid="n"/>
                                                    </note>
                                                    <note dur="4" pname="f" oct="4" accid="s"/>
                                                </layer>
                                                <layer n="2">
                                                    <note dur="4" pname="g" oct="4"/>
                                                    <note dur="4" pname="f" oct="4"/>
                                                    <note dur="4" pname="e" oct="4"/>
                                                    <note dur="4" pname="e" oct="4"/>
                                                    <note dur="4" pname="d" oct="4"/>
                                                </layer>
                                            </staff>
                                                </measure>
                                            </section>
                                        </score>
                                    </mdiv>
                                </body>
                            </music>
                        </mei>
                    `;
                    const dyadToolkit = new verovio.toolkit();
                    dyadToolkit.setOptions({
                        scale: 40,
                        pageWidth: 900,
                        pageHeight: 500,
                        pageMarginTop: 20,
                        pageMarginBottom: 20,
                        footer: "none",
                        adjustPageHeight: true,
                        adjustPageWidth: true
                    });
                    if (!dyadToolkit.loadData(dyadMei)) {
                        console.error(dyadToolkit.getLog());
                        return;
                    }
                    renderContainer.querySelector(".harmonic-render-score").innerHTML =
                        dyadToolkit.renderToSVG(1, {});
                    aside.append(renderContainer);
                }
                function renderDyadstwo() {
                    const aside = document.getElementById("info");
                    const renderContainer = document.createElement("div");
                    renderContainer.className = "harmonic-render";
                    renderContainer.innerHTML = `
                        <div class="harmonic-render-score"></div>
                    `;

                    const dyadMei = `
                        <mei xmlns="http://www.music-encoding.org/ns/mei" meiversion="5.1">
                            <music>
                                <body>
                                    <mdiv>
                                        <score>
                                            <scoreDef>
                                                <staffGrp>
                                                    <staffDef n="1" lines="5">
                                                        <clef shape="F" line="4"/>
                                                    </staffDef>
                                                </staffGrp>
                                            </scoreDef>
                                            <section>
                                                <measure n="1">
                                            <staff n="1">
                                                <layer n="1">
                                                    <note xml:id="note1" dur="2" pname="d" oct="4"/>
                                                    <note xml:id="note2" dur="2" pname="e" oct="4"/>
                                                    <note xml:id="note3" dur="2" pname="f" oct="4">
                                                    </note>
                                                    <note xml:id="note4" dur="2" pname="g" oct="4">
                                                    </note>
                                                    <note xml:id="note5" dur="2" pname="f" oct="4" accid="s"/>
                                                </layer>
                                                <layer n="2">
                                                    <beam>
                                                        <note xml:id="note6" dur="4" pname="c" oct="4"/>
                                                        <note xml:id="note7" dur="8" pname="b" oct="3"/>
                                                        <note xml:id="note8" dur="8" pname="d" oct="4"/>
                                                    </beam>
                                                    <beam>
                                                        <note xml:id="note9" dur="4" pname="d" oct="4"/>
                                                        <note xml:id="note10" dur="8" pname="c" oct="4"/>
                                                        <note xml:id="note11" dur="8" pname="e" oct="4"/>
                                                    </beam>
                                                    <beam>
                                                        <note xml:id="note12" dur="4" pname="e" oct="4"/>
                                                        <note xml:id="note13" dur="8" pname="d" oct="4"/>
                                                        <note xml:id="note14" dur="8" pname="f" oct="4"/>
                                                    </beam>
                                                    <beam>
                                                        <note xml:id="note15" dur="4" pname="f" oct="4"/>
                                                        <note xml:id="note16" dur="4" pname="e" oct="4"/>
                                                    </beam>
                                                    <note xml:id="note17" dur="2" pname="d" oct="4"/>
                                                </layer>
                                            </staff>
                                            <harm place="below" startid="note6" color="red">2</harm>
                                            <harm place="below" startid="note7" color="red">3</harm>
                                            <harm place="below" startid="note8" color="red">1</harm>
                                            <harm place="below" startid="note9" color="red">2</harm>
                                            <harm place="below" startid="note10" color="red">3</harm>
                                            <harm place="below" startid="note11" color="red">1</harm>
                                            <harm place="below" startid="note12" color="red">2</harm>
                                            <harm place="below" startid="note13" color="red">3</harm>
                                            <harm place="below" startid="note14" color="red">1</harm>
                                            <harm place="below" startid="note15" color="red">2</harm>
                                            <harm place="below" startid="note16" color="red">3</harm>
                                            <harm place="below" startid="note17" color="red">3</harm>
                                            <tie startid="note8" endid="note9"/>
                                            <tie startid="note11" endid="note12"/>
                                            <tie startid="note14" endid="note15"/>
                                                </measure>
                                            </section>
                                        </score>
                                    </mdiv>
                                </body>
                            </music>
                        </mei>
                    `;
                    const dyadToolkit = new verovio.toolkit();
                    dyadToolkit.setOptions({
                        scale: 40,
                        pageWidth: 900,
                        pageHeight: 500,
                        pageMarginTop: 20,
                        pageMarginBottom: 20,
                        footer: "none",
                        adjustPageHeight: true,
                        adjustPageWidth: true
                    });
                    if (!dyadToolkit.loadData(dyadMei)) {
                        console.error(dyadToolkit.getLog());
                        return;
                    }
                    renderContainer.querySelector(".harmonic-render-score").innerHTML =
                        dyadToolkit.renderToSVG(1, {});
                    aside.append(renderContainer);
                }

                function renderImage() {
                    const aside = document.getElementById("info");
                    const renderContainer = document.createElement("div");
                    renderContainer.className = "image-render";
                    renderContainer.innerHTML = `
                        <img src="corelli.png" alt="Meowmeow">
                    `;
                    aside.append(renderContainer);
                }

                cancelDynamicGliss = () => {
                    const parser = new DOMParser();
                    const document = parser.parseFromString(mei, "application/xml");
                    let removed = false;

                    for (const annotation of [...document.getElementsByTagName("*")]) {
                        const annotationId = annotation.getAttribute("xml:id") || "";
                        if (/^(?:gliss|harm)\d+$/.test(annotationId)) {
                            annotation.remove();
                            removed = true;
                        }
                    }
                    dynamicGlissIds.clear();
                    dynamicHarmIds.clear();
                    if (!removed) return;

                    mei = new XMLSerializer().serializeToString(document);
                    if (!tk.loadData(mei)) {
                        console.error(tk.getLog());
                        return;
                    }
                    pageCount = tk.getPageCount();
                    renderPage(currentPage);
                };

                function renderPage(n) {
                    currentPage = Math.min(Math.max(n, 1), pageCount);
                    container.innerHTML = tk.renderToSVG(currentPage, {});
                    container.querySelectorAll("g.reh").forEach(g => {
                        g.setAttribute("transform", "translate(0, -300)");
                    });
                    applySelection(container);
                    setClass(container, highlightedNoteIds, "note-focus", true);
                    pageLabel.textContent = `Page ${currentPage} / ${pageCount}`;
                    prevBtn.disabled = currentPage <= 1;
                    nextBtn.disabled = currentPage >= pageCount;
                }

                prevBtn.addEventListener("click", () => renderPage(currentPage - 1));
                nextBtn.addEventListener("click", () => renderPage(currentPage + 1));

                // ---- delegated listeners ----
                container.addEventListener("click", (e) => {
                    const clickedEl = e.target.closest("g.note, g.reh");
                    const group = clickedEl ? (idToGroup[clickedEl.id] ?? null) : null;

                    // Clicking empty space dismisses the strip; notes and rehearsal marks remain selectable.
                    if (group !== selectedGroup) {
                        cancelDynamicGliss?.();
                        clearNoteHighlights(container);
                    }
                    selectedGroup = group;
                    selectedElementId = clickedEl?.id ?? null;
                    applySelection(container);
                    updateAside(group, clickedEl);

                    if (clickedEl) {
                        onNoteClick(clickedEl.id, group, e, container, {
                            addGliss,
                            addHarm,
                            renderDyads,
                            renderDyadstwo,
                            renderImage,
                            highlightNotes: (...ids) => highlightNotes(container, ...ids),
                        });
                    }
                });

                container.addEventListener("mouseover", (e) => {
                    const noteEl = e.target.closest("g.note");
                    container.querySelectorAll(".hl").forEach(el => el.classList.remove("hl"));
                    if (!noteEl) return;
                    const group = idToGroup[noteEl.id];
                    setClass(container, group ? groups[group] : [noteEl.id], "hl", true);
                });

                container.addEventListener("mouseleave", () => {
                    container.querySelectorAll(".hl").forEach(el => el.classList.remove("hl"));
                });

                // close button (delegated, since the strip's contents are rebuilt)
                aside.addEventListener("click", (e) => {
                    if (e.target.id === "infoClose") clearSelection(container);
                });
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") clearSelection(container);
                });

                renderPage(1);
            }

            try {
                await setupExample("sOctet.mei", "notation1");
            } catch (e) {
                console.error("Setup failed:", e);
            }
        });
    </script>
</head>

    <div id="notation1"></div>
    <aside id="info" hidden></aside>
    <aside id="videoInfo">
        <iframe class="video" src="https://www.youtube.com/embed/GC6CpS7OPow" title="Performance video" loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
