<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph Scale Toggle</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      margin-bottom: 1.5rem;
      color: #333;
      font-size: 28px;
    }
    
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 2rem;
    }
    
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: white;
      color: #333;
    }

    .tuningbuttons {
      display: flex;
      gap: 12px;
    }
    .tuningbuttons button {
      padding: 10px 20px;
      font-size: 10px;
      font-weight: 500;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: white;
      color: #333;
    }

    .tuningbuttons button:hover {
      border-color: #999;
      background: #f9f9f9;
    }

    .tuningbuttons button.active {
      background: #28a745;
      color: white;
      border-color: #1e7e34;
    }
    
    button:hover {
      border-color: #999;
      background: #f9f9f9;
    }
    
    button.active {
      background: #007bff;
      color: white;
      border-color: #0056b3;
    }
    
    button.active:hover {
      background: #0056b3;
    }
    
    .chart-container {
      position: relative;
      height: 400px;
      margin-bottom: 1.5rem;
    }
    
    .info {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    
    .info p {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tuning comparisons with A=440 Hz</h1>
    
    <div class="controls">
      <button id="linearBtn" class="active">Linear Scale</button>
      <button id="logBtn">Logarithmic Scale</button>
    </div>
    
    <div class="tuningbuttons">
      <button class="active" id="12TET">12-Tone Equal Temperament</button>
      <button id="Pythag">Pythagorean Tuning</button>
      <button id="Just">Just Intonation</button>
      <button id="Meantone">Meantone Temperament (quarter comma)</button>
    </div>

    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
    
    <div class="info">
      <p><strong>Mode:</strong> <span id="scaleLabel">Linear</span></p>
      <p><strong>Tuning:</strong> <span id="tuningLabel">12-Tone Equal Temperament</span></p>
    </div>
  </div>

  <script>
    // Generate sample exponential growth data
    const A4hz = 440;
    const A3hz = A4hz / 2;
    const labels = ['C3', 'C#3', 'D3', 'D#3', 'E3', 'F3', 'F#3', 'G3', 'G#3', 'A3', 'A#3', 'B3',
      'C4', 'C#4', 'D4', 'D#4', 'E4', 'F4', 'F#4', 'G4', 'G#4', 'A4', 'A#4', 'B4'];
    const labelsice = labels.slice(12, 24);
    const TETdata = [
      A4hz * Math.pow(2, -21 / 12), // C3
      A4hz * Math.pow(2, -20 / 12), // C#3
      A4hz * Math.pow(2, -19 / 12), // D3
      A4hz * Math.pow(2, -18 / 12), // D#3
      A4hz * Math.pow(2, -17 / 12), // E3
      A4hz * Math.pow(2, -16 / 12), // F3
      A4hz * Math.pow(2, -15 / 12), // F#3
      A4hz * Math.pow(2, -14 / 12), // G3
      A4hz * Math.pow(2, -13 / 12), // G#3
      A4hz * Math.pow(2, -12 / 12), // A3
      A4hz * Math.pow(2, -11 / 12), // A#3
      A4hz * Math.pow(2, -10 / 12), // B3
      A4hz * Math.pow(2, -9 / 12), // C4
      A4hz * Math.pow(2, -8 / 12), // C#4
      A4hz * Math.pow(2, -7 / 12), // D4
      A4hz * Math.pow(2, -6 / 12), // D#4
      A4hz * Math.pow(2, -5 / 12), // E4
      A4hz * Math.pow(2, -4 / 12), // F4
      A4hz * Math.pow(2, -3 / 12), // F#4
      A4hz * Math.pow(2, -2 / 12), // G4
      A4hz * Math.pow(2, -1 / 12), // G#4
      A4hz,                        // A4
      A4hz * Math.pow(2, 1 / 12), // A#4
      A4hz * Math.pow(2, 2 / 12)   // B4
    ];
    const pythagData = [
      A3hz * (16/27) ,  // C4
      A3hz * (81/128) , // C#4
      A3hz * (4/6) , // D4
      A3hz * (729/(512*2)), // D#4
      A3hz * 3/4, // E4
      A3hz * (128/162), // F4
      A3hz * (27/32), // F#4
      A3hz * (16/18), // G4
      A3hz * (243/(128*2)) , // G#4
      A3hz,  // A3
      A3hz * (256/243) ,  // A#3
      A4hz * (9/16) ,  // B3
      A4hz * (16/27) ,  // C4
      A4hz * (81/128) , // C#4
      A4hz * (4/6) , // D4
      A4hz * (729/(512*2)), // D#4
      A4hz * 3/4, // E4
      A4hz * (128/162), // F4
      A4hz * (27/32), // F#4
      A4hz * (16/18), // G4
      A4hz * (243/(128*2)) , // G#4
      A4hz, // A4
      A4hz * (256/243), // A#4
      A4hz * (9/8) // B4
    ];

    // Initialize chart variables
    const ctx = document.getElementById('myChart').getContext('2d');
    let chart;
    let isLogarithmic = false;
    let data = TETdata;
    let dataslice = data.slice(12,24);
    // Create the chart
    function createChart() {
      if (chart) {
        chart.destroy();
      }

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labelsice,
          datasets: [
            {
              label: 'Pitch',
              data: dataslice,
              borderColor: '#007bff',
              backgroundColor: 'rgba(0, 123, 255, 0.1)',
              borderWidth: 3,
              tension: 0.4,
              fill: true,
              pointRadius: 6,
              pointBackgroundColor: '#007bff',
              pointBorderColor: 'white',
              pointBorderWidth: 2,
              pointHoverRadius: 8
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              labels: {
                font: { size: 14, weight: 'bold' },
                color: '#333'
              }
            },
            title: {
              display: true,
              text: isLogarithmic ? 'Logarithmic frequencies' : 'Linear frequencies',
              font: { size: 16, weight: 'bold' },
              color: '#333'
            }
          },
          scales: {
            y: {
              type: isLogarithmic ? 'logarithmic' : 'linear',
              ticks: {
                color: '#666',
                font: { size: 12 },
                callback: function(value) {
                  if (isLogarithmic) {
                    return value;
                  } else {
                    return value.toFixed(0);
                  }
                }
              },
              grid: {
                color: 'rgba(0, 0, 0, 0.05)'
              },
              title: {
                display: true,
                text: isLogarithmic ? 'HZ' : 'HZ',
                color: '#333',
                font: { size: 12, weight: 'bold' }
              }
            },
            x: {
              ticks: {
                color: '#666',
                font: { size: 12 }
              },
              grid: {
                color: 'rgba(0, 0, 0, 0.05)'
              }
            }
          }
        }
      });
    }

    // Handle Linear button click
    document.getElementById('linearBtn').addEventListener('click', function() {
      isLogarithmic = false;
      updateButtons();
      createChart();
      document.getElementById('scaleLabel').textContent = 'Linear';
    });

    // Handle Logarithmic button click
    document.getElementById('logBtn').addEventListener('click', function() {
      isLogarithmic = true;
      updateButtons();
      createChart();
      document.getElementById('scaleLabel').textContent = 'Logarithmic';
    });

    // Handle tuning button clicks
    document.getElementById('12TET').addEventListener('click', function() {
      updateTuning('12-Tone Equal Temperament', TETdata);
    });
    document.getElementById('Pythag').addEventListener('click', function() {
      updateTuning('Pythagorean Tuning', pythagData);
    });
    document.getElementById('Just').addEventListener('click', function() {
      updateTuning('Just Intonation');
    });
    document.getElementById('Meantone').addEventListener('click', function() {
      updateTuning('Meantone Temperament (quarter comma)');
    });

    // Update button styles
    function updateButtons() {
      const linearBtn = document.getElementById('linearBtn');
      const logBtn = document.getElementById('logBtn');

      if (isLogarithmic) {
        linearBtn.classList.remove('active');
        logBtn.classList.add('active');
      } else {
        linearBtn.classList.add('active');
        logBtn.classList.remove('active');
      }
    }

    function updateTuning(tuning, tuningData = data) {
      console.log(`Selected tuning: ${tuning}`);
      data = tuningData;
      dataslice = data.slice(12, 24);
      document.getElementById('tuningLabel').textContent = tuning;
      createChart();

      if (tuning === '12-Tone Equal Temperament') {
        document.getElementById('12TET').classList.add('active');
        document.getElementById('Pythag').classList.remove('active');
        document.getElementById('Just').classList.remove('active');
        document.getElementById('Meantone').classList.remove('active');
      } else if (tuning === 'Pythagorean Tuning') {
        document.getElementById('12TET').classList.remove('active');
        document.getElementById('Pythag').classList.add('active');
        document.getElementById('Just').classList.remove('active');
        document.getElementById('Meantone').classList.remove('active');
      } else if (tuning === 'Just Intonation') {
        document.getElementById('12TET').classList.remove('active');
        document.getElementById('Pythag').classList.remove('active');
        document.getElementById('Just').classList.add('active');
        document.getElementById('Meantone').classList.remove('active');
      } else if (tuning === 'Meantone Temperament (quarter comma)') {
        document.getElementById('12TET').classList.remove('active');
        document.getElementById('Pythag').classList.remove('active');
        document.getElementById('Just').classList.remove('active');
        document.getElementById('Meantone').classList.add('active');
      }
    }

    // Initialize chart on page load
    createChart();
  </script>
</body>
</html>
